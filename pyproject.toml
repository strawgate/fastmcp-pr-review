[project]
name = "fastmcp-pr-review"
version = "0.1.0"
description = "FastMCP server for GitHub PR review with structured sampling"
readme = "README.md"
authors = [
    { name = "strawgate", email = "williamseaston@gmail.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = ["mcp", "fastmcp", "github", "pull-request", "code-review", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "fastmcp==3.2.4",
    "githubkit[auth-app]>=0.12.0",
    "google-genai>=1.0.0",
    "logfire[google-genai,mcp]>=4.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/strawgate/fastmcp-pr-review"
Repository = "https://github.com/strawgate/fastmcp-pr-review"
Documentation = "https://github.com/strawgate/fastmcp-pr-review#readme"

[project.scripts]
fastmcp-pr-review = "fastmcp_pr_review.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["fastmcp_pr_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
